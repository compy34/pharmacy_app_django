<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pharmacy App{% endblock title %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .nav-link {
            color: white;
        }
        .nav-link:hover {
            color: #d1d5db;
        }
        .navbar-text {
            color: darkmagenta;
        }
        input[type='text'],
        input[type='password'],
        input[type='email']
        {
            display: block;
            width: 100%;
            padding: .375rem .75rem;
            border: 1px solid #dee2e6;
            border-radius: .375rem ;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Pharmacy App</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a href="/list" class="nav-link">medicines catalog</a>
                <a href="/about" class="nav-link">about us</a>
                {% if user.is_authenticated %}
                    <a href="#" class="nav-link">my orders</a>
                    <span class="navbar-text mx-2 fw-semibold">{{ user.username }}</span>
                    <form method="POST" action="/accounts/signout/" class="d-inline ms-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">logout</button>
                    </form>
                {% else %}
                    <a href="/accounts/signin" class="nav-link">login</a>
                    <a href="/accounts/signup" class="nav-link">register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Потрібно для роботи закриття alert (bootstrap dismissible) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
