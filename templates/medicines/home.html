{% extends 'base.html' %}

{% block title %}Pharmacy App - Home{% endblock %}

{% block content %}
<div class="content">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
        <div class="container-fluid py-2">
            <h2 class="display-5 fw-bold">Find medicine in your area</h2>
            <p class="fs-5 text-secondary">
                Find the necessary medicines, compare prices in pharmacies. It’s convenient — just submit a request.
            </p>
            <form action="/" method="get" class="row g-2 mt-4">
                <div class="col-md-9">
                    <input type="text" name="query" class="form-control form-control-lg" placeholder="Search for medicines">
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Find</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
